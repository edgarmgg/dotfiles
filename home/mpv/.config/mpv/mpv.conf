# Máxima calidad para 1080p -> 4K (iGPU AMD, Wayland)
profile=high-quality
vo=gpu-next
hwdec=auto-safe

# Reescalado: EWA Lanczos (el mejor de mpv para subir resolución)
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell

# Sincroniza los fotogramas con la frecuencia de la pantalla (refresco-auto.lua
# la pone en un múltiplo de los fps de cada vídeo)
video-sync=display-resample

# Subtítulos nítidos a 4K
sub-auto=fuzzy

# Interfaz uosc (requiere desactivar la OSC por defecto)
osc=no
osd-bar=no
border=no


# Reanudar donde lo dejaste (al cerrar con q) y recordar pistas
save-position-on-quit=yes

# Idiomas: audio japonés, subtítulos en español latino
alang=ja,jpn
slang=es-419,es-la,es,spa

# Al acabar un episodio pasa al siguiente. En el último se queda en su último fotograma
# para que arc-nav.lua abra el arco siguiente (o cierre si no hay)
keep-open=yes

# Socket para el mando web (mpv-remote)
input-ipc-server=/tmp/mpvsocket
