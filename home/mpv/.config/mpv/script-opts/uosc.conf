# Barra de controles: solo la línea de progreso cuando no hay ratón encima
timeline_style=line
timeline_size=40
controls=menu,gap,subtitles,<has_many_audio>audio,<has_many_video>video,gap,<video,audio>speed,space,shuffle,loop-playlist,loop-file,gap,fullscreen
# Aparece al acercar el ratón y se esconde sola
progress=windowed
progress_size=2
# Miniaturas, colores y tiempos
color=foreground=ffffff,foreground_text=000000,background=000000,background_text=ffffff,curtain=111111,success=a5e075,error=ff616e
opacity=timeline=0.9,position=1,chapters=0.8,slider=0.9,speed=0.6
animation_duration=100
flash_duration=1000
proximity_in=40
proximity_out=120
font_scale=1
text_border=1.2
destination_time=total
time_precision=0
buffered_time_threshold=60
autohide=no
pause_indicator=flash
stream_quality_options=2160,1440,1080,720,480
video_types=3g2,3gp,asf,avi,f4v,flv,h264,h265,m2ts,m4v,mkv,mov,mp4,mpeg,mpg,ogm,ogv,rm,rmvb,ts,vob,webm,wmv,y4m
audio_types=aac,ac3,aiff,ape,au,cue,dsf,dts,flac,m4a,mid,midi,mka,mp3,oga,ogg,opus,spx,tak,tta,wav,weba,wma
image_types=apng,avif,bmp,gif,j2k,jp2,jfif,jpeg,jpg,jxl,mj2,png,svg,tga,tif,tiff,webp
subtitle_types=aqt,ass,gsub,idx,jss,lrc,mks,pgs,pjs,psb,rt,sbv,slt,smi,sub,sup,utf8,utf-8,utf,vtt
default_directory=~/
use_trash=no
