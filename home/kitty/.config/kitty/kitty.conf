# Tema de Edgar (Ptyxis) y pestañas de DankMaterialShell
include theme-edgar.conf
include dank-tabs.conf

# Fuente
font_family      JetBrainsMono Nerd Font
font_size        12.0

# Sin ligaduras (->, !=, >= se ven como caracteres sueltos)
disable_ligatures always

# Cursor en forma de barra
cursor_shape beam

# Tamaño inicial: lo justo para fastfetch (94 cols x 24 líneas + prompt)
remember_window_size  no
initial_window_width  96c
initial_window_height 27c

# Transparencia leve
background_opacity    0.80

confirm_os_window_close 0

# Barra de título negra
wayland_titlebar_color #0a0a0a

# Margen interior para que el texto no quede pegado al borde
window_padding_width  3 8 8 8

# Shell: fish (antes se arrancaba a través de tmux)
shell /usr/bin/fish

# Sin paneles (splits): se desactiva el atajo por defecto de nueva ventana
map ctrl+shift+enter no_op
