# Ratón, historial y numeración desde 1
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0

# Colores correctos dentro de tmux
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Dividir paneles con | y -, abriendo en la carpeta actual
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Recargar la configuración con prefijo + r
bind r source-file ~/.tmux.conf \; display "Configuración recargada"

# Barra de estado
set -g status-style "bg=#0a0a0a,fg=#d4d4d8"
set -g status-left "#[fg=#22c55e,bold] #{?session_group,#{session_group},#S}  "
set -g status-right "#[fg=#6b7280]%H:%M "
# Pestañas: "tmux" si solo hay fish/bash; si corre otro programa, su nombre (claude, vim...)
setw -g window-status-format "#[fg=#6b7280] #{?#{||:#{==:#{window_name},fish},#{==:#{window_name},bash}},tmux,#{window_name}} "
setw -g window-status-current-format "#[fg=#22c55e,bold] #{?#{||:#{==:#{window_name},fish},#{==:#{window_name},bash}},tmux,#{window_name}} "

# Una terminal = una pestaña: al cerrar la terminal se cierra su ventana
# (el dueño lo marca ~/.bashrc en la opción de ventana @owner)
set-hook -g client-detached 'run-shell "~/.config/tmux/close-owned.sh #{hook_client}"'

# Bordes de paneles y mensajes
set -g pane-border-style "fg=#4b4b4b"
set -g pane-active-border-style "fg=#22c55e"
set -g message-style "bg=#0a0a0a,fg=#ff6a3d"

# Shell por defecto en cada panel nuevo
set -g default-shell /usr/bin/fish

# ---------- Moverse sin prefijo ----------
# Alt+flechas entre paneles (pisa Alt+←/→ de fish; Ctrl+←/→ sigue saltando palabras)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
# Alt+1..9 salta a la ventana con ese número
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ---------- Sesiones ----------
# prefijo+s ya lista sesiones; prefijo+$ renombra la actual
bind S command-prompt -p "Nombre de la nueva sesión:" "new-session -A -s '%%'"
bind K confirm-before -p "¿Cerrar la sesión #S? (y/n)" kill-session

# ---------- Portapapeles del sistema (Wayland, necesita wl-clipboard) ----------
# Seleccionar con el ratón o M-w en modo copia lo envía a wl-copy
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode    M-w send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel "wl-copy"

# ---------- Plugins (TPM): guardar y restaurar sesiones ----------
# prefijo+I instala plugins nuevos, prefijo+Ctrl+s guarda, prefijo+Ctrl+r restaura
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Autoguardado sí, restauración automática no: chocaría con "una terminal = una pestaña"
# (al abrir una terminal reaparecerían las pestañas de la última sesión guardada).
# Tras reiniciar el PC, restaura a mano con prefijo+Ctrl+r.
set -g @continuum-restore 'off'
set -g @resurrect-capture-pane-contents 'on'

# Debe ir la última línea del archivo
run '~/.tmux/plugins/tpm/tpm'
